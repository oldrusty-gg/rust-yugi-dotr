[package]
name = "roses-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Read-only native board presentation for explicit Roses snapshots"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
roses-assets = { path = "../../crates/roses-assets" }
roses-disc = { path = "../../crates/roses-disc" }
roses-compare = { path = "../../crates/roses-compare" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
