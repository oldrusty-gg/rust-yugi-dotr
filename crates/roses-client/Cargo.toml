[package]
name = "roses-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native opening-slice player for validated user-imported media and layout data"

[features]
default = ["online"]
# Port additions (not in the 2003 game): the online duel's player names on
# the HUD plates. Off: the original's plates only (docs/ADDITIONS.md).
online = ["roses-core/online"]

[dependencies]
roses-assets = { path = "../../crates/roses-assets" }
roses-core = { path = "../../crates/roses-core", default-features = false }
roses-movie = { path = "../../crates/roses-movie" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
png.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Input_XboxController"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
