# Build and test everything that needs no game data, and check that the
# tree holds no game data, personal paths, server addresses or binaries.
# Sibling repositories are checked out beside this one (docs/REPOSITORIES.md);
# the repository variable ROSES_SIBLING_REF picks their branch or tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ROSES_MUTE: "1"
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.96.1"

jobs:
  content-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Content guard
        run: python scripts/publish/content_guard.py .

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-yugi-dotr
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/platform-sdk
          ref: ${{ vars.ROSES_SIBLING_REF || 'main' }}
          path: platform-sdk
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/platform-accounts
          ref: ${{ vars.ROSES_SIBLING_REF || 'main' }}
          path: platform-accounts
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-yugi-dotr -> target
            rust-yugi-dotr/crates/roses-game -> target
      - name: Build the workspace
        working-directory: rust-yugi-dotr
        run: cargo build --workspace --locked
      - name: Test the workspace (tests needing game data are ignored)
        working-directory: rust-yugi-dotr
        run: cargo test --workspace --locked
      - name: Test the game crate (shader validation needs no GPU)
        working-directory: rust-yugi-dotr/crates/roses-game
        run: cargo test --locked --features renderer
      - name: Build the game
        working-directory: rust-yugi-dotr/crates/roses-game
        run: cargo build --locked --features renderer --bin roses-bevy-scene
      # The faithful build: every port addition (Online Play and the rest,
      # docs/ADDITIONS.md) compiled out; the offline duel tests check the
      # same state hashes as the default build.
      - name: Test the rules without the online additions
        working-directory: rust-yugi-dotr
        run: |
          cargo test --locked -p roses-core --no-default-features
          cargo test --locked -p roses-client --no-default-features
      - name: Test the game crate, faithful build
        working-directory: rust-yugi-dotr/crates/roses-game
        run: cargo test --locked --no-default-features --features renderer
      - name: Build the game, faithful build
        working-directory: rust-yugi-dotr/crates/roses-game
        run: cargo build --locked --no-default-features --features renderer --bin roses-bevy-scene

  linux-server:
    # The server runs on Linux (also arm64) in production.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-yugi-dotr
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/platform-sdk
          ref: ${{ vars.ROSES_SIBLING_REF || 'main' }}
          path: platform-sdk
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/platform-accounts
          ref: ${{ vars.ROSES_SIBLING_REF || 'main' }}
          path: platform-accounts
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-yugi-dotr -> target
      - name: Test the server
        working-directory: rust-yugi-dotr
        run: cargo test --locked -p roses-server
